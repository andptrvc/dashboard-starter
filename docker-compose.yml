version: "3.8"

services:
  postgress:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: andras
      POSTGRES_PASSWROD: andras12345
      POSTGRES_DB: school
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    container_name: nextjs_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL: "postgresql://andras:andras12345@localhost:5432/school"
    depends_on:
      - postgress
